<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 180" fill="none">
  <defs>
    <!-- Background rounded squircle with subtle luxury glow -->
    <linearGradient id="appleBg" x1="0" y1="0" x2="180" y2="180" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Vibrant Rich Purple to Violet Gradient -->
    <linearGradient id="applePurpleGrad" x1="25" y1="25" x2="155" y2="155" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#5521B5" />
      <stop offset="25%" stop-color="#6B46C1" />
      <stop offset="65%" stop-color="#805AD5" />
      <stop offset="100%" stop-color="#9F7AEA" />
    </linearGradient>

    <filter id="applePurpleGlow" x="10" y="10" width="160" height="160" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#6B46C1" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- iOS squircle base -->
  <rect width="180" height="180" rx="42" fill="url(#appleBg)" />
  <rect width="178" height="178" x="1" y="1" rx="41" stroke="rgba(107, 70, 193, 0.4)" stroke-width="2" fill="none" />

  <!-- Centered Circular Purple Badge (Diameter 114) -->
  <circle cx="90" cy="90" r="56" fill="url(#applePurpleGrad)" filter="url(#applePurpleGlow)" />
  <circle cx="90" cy="90" r="55" stroke="rgba(255, 255, 255, 0.25)" stroke-width="2" />

  <!-- Centered Geometric "B" -->
  <g transform="translate(90, 90) scale(0.72) translate(-47, -47)">
    <path
      d="M 23 25 C 23 23.34 24.34 22 26 22 L 48.5 C 59.8 22 69 31.2 69 42.5 C 69 49.6 65.3 55.8 59.5 59.3 C 57.2 60.7 54.3 61.5 51 61.5 L 34.5 61.5 L 43.5 45 L 30 45 L 23 25 Z"
      fill="#FFFFFF"
    />
    <path
      d="M 23 70 C 23 71.66 24.34 73 26 73 L 53 C 65.2 73 74 63.8 74 52 C 74 46.5 71.8 41.5 68 38 L 57.5 48 C 59.5 50 61 52.8 61 56 C 61 62.5 55.5 67 48.5 67 L 33 67 L 40 54 L 27.5 54 L 23 70 Z"
      fill="#FFFFFF"
    />
    <path
      d="M 37.5 31 L 47.5 31 C 53.5 31 58 35.5 58 41.5 C 58 47.5 53.5 52 47.5 52 L 40.5 52 L 37.5 31 Z"
      fill="url(#applePurpleGrad)"
    />
    <circle cx="34" cy="47" r="3.5" fill="#FFFFFF" opacity="0.9" />
  </g>
</svg>
