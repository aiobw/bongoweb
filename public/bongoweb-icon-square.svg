<svg viewBox="0 0 256 256" width="256" height="256" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Vibrant Rich Purple to Violet Gradient -->
    <linearGradient id="bwPurpleSquareGrad" x1="50" y1="50" x2="205" y2="205" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#5521B5" />
      <stop offset="25%" stop-color="#6B46C1" />
      <stop offset="65%" stop-color="#805AD5" />
      <stop offset="100%" stop-color="#9F7AEA" />
    </linearGradient>

    <!-- Deep Ambient Glow for Icon -->
    <filter id="squareIconGlow" x="16" y="20" width="224" height="224" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#6B46C1" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- ============================================================== -->
  <!-- VERSION 2: ICON ONLY (SQUARE, MASKABLE / ADAPTIVE SAFE ZONE)   -->
  <!-- Canvas: 256x256 | Safe Margin: 48px padding (Adaptive 66% Key) -->
  <!-- ============================================================== -->
  <g id="adaptive-icon-center" transform="translate(128, 128)">
    <!-- Base Circular Emblem (Radius 80 = Diameter 160) -->
    <circle cx="0" cy="0" r="80" fill="url(#bwPurpleSquareGrad)" filter="url(#squareIconGlow)" />

    <!-- Sleek Glass / Specular Rim Highlight -->
    <circle cx="0" cy="0" r="78.5" stroke="rgba(255, 255, 255, 0.25)" stroke-width="2.5" />

    <!-- Stylized Geometric "B" Monogram scaled & centered -->
    <g transform="translate(-47, -47) scale(1)">
      <!-- Primary Upper Wing / Loop of "B" -->
      <path
        d="M 23 25 C 23 23.34 24.34 22 26 22 L 48.5 C 59.8 22 69 31.2 69 42.5 C 69 49.6 65.3 55.8 59.5 59.3 C 57.2 60.7 54.3 61.5 51 61.5 L 34.5 61.5 L 43.5 45 L 30 45 L 23 25 Z"
        fill="#FFFFFF"
      />

      <!-- Lower Flowing Wing / Loop of "B" -->
      <path
        d="M 23 70 C 23 71.66 24.34 73 26 73 L 53 C 65.2 73 74 63.8 74 52 C 74 46.5 71.8 41.5 68 38 L 57.5 48 C 59.5 50 61 52.8 61 56 C 61 62.5 55.5 67 48.5 67 L 33 67 L 40 54 L 27.5 54 L 23 70 Z"
        fill="#FFFFFF"
      />

      <!-- Internal Flowing Cutout Accent inside Upper Loop -->
      <path
        d="M 37.5 31 L 47.5 31 C 53.5 31 58 35.5 58 41.5 C 58 47.5 53.5 52 47.5 52 L 40.5 52 L 37.5 31 Z"
        fill="url(#bwPurpleSquareGrad)"
      />

      <!-- Dynamic Flow Center Dot / Energy Core -->
      <circle cx="34" cy="47" r="3.5" fill="#FFFFFF" opacity="0.9" />
    </g>
  </g>
</svg>
