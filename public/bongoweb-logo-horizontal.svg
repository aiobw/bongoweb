<svg viewBox="0 0 440 110" width="440" height="110" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Vibrant Rich Purple to Violet Gradient -->
    <linearGradient id="bwPurpleGrad" x1="10" y1="15" x2="95" y2="95" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#5521B5" />
      <stop offset="25%" stop-color="#6B46C1" />
      <stop offset="65%" stop-color="#805AD5" />
      <stop offset="100%" stop-color="#9F7AEA" />
    </linearGradient>

    <!-- Wordmark Gradient: Deep Tech Slate transitioning into Rich Violet -->
    <linearGradient id="bwTextGrad" x1="120" y1="20" x2="430" y2="85" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="55%" stop-color="#1E1B4B" />
      <stop offset="78%" stop-color="#6B46C1" />
      <stop offset="100%" stop-color="#9F7AEA" />
    </linearGradient>

    <!-- Subtle Drop Shadow for Badge -->
    <filter id="softGlow" x="0" y="0" width="115" height="115" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#6B46C1" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- ============================================== -->
  <!-- 1. ICON MARK: Stylized Geometric "B" (Left)    -->
  <!-- ============================================== -->
  <g id="icon-mark" transform="translate(10, 8)">
    <!-- Base Circular Emblem with Glow -->
    <circle cx="47" cy="47" r="45" fill="url(#bwPurpleGrad)" filter="url(#softGlow)" />

    <!-- Outer rim highlight for modern sleek glass feel -->
    <circle cx="47" cy="47" r="44.25" stroke="rgba(255, 255, 255, 0.22)" stroke-width="1.5" />

    <!-- Stylized Geometric "B" Monogram formed by smooth flowing curves -->
    <!-- Primary Upper Wing / Loop of "B" -->
    <path
      d="M 23 25 C 23 23.34 24.34 22 26 22 L 48.5 C 59.8 22 69 31.2 69 42.5 C 69 49.6 65.3 55.8 59.5 59.3 C 57.2 60.7 54.3 61.5 51 61.5 L 34.5 61.5 L 43.5 45 L 30 45 L 23 25 Z"
      fill="#FFFFFF"
    />

    <!-- Lower Flowing Wing / Loop of "B" -->
    <path
      d="M 23 70 C 23 71.66 24.34 73 26 73 L 53 C 65.2 73 74 63.8 74 52 C 74 46.5 71.8 41.5 68 38 L 57.5 48 C 59.5 50 61 52.8 61 56 C 61 62.5 55.5 67 48.5 67 L 33 67 L 40 54 L 27.5 54 L 23 70 Z"
      fill="#FFFFFF"
    />

    <!-- Internal Flowing Cutout Accent inside Upper Loop -->
    <path
      d="M 37.5 31 L 47.5 31 C 53.5 31 58 35.5 58 41.5 C 58 47.5 53.5 52 47.5 52 L 40.5 52 L 37.5 31 Z"
      fill="url(#bwPurpleGrad)"
    />

    <!-- Dynamic Flow Center Dot / Energy Core -->
    <circle cx="34" cy="47" r="3.5" fill="#FFFFFF" opacity="0.9" />
  </g>

  <!-- ============================================== -->
  <!-- 2. WORDMARK: "BongoWeb" (Right)                -->
  <!-- ============================================== -->
  <g id="wordmark" transform="translate(125, 0)">
    <!-- Main Brand Name Text -->
    <text
      x="0"
      y="75"
      font-family="'Plus Jakarta Sans', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
      font-weight="900"
      font-size="62"
      letter-spacing="-1.8px"
      fill="url(#bwTextGrad)"
    >BongoWeb</text>

    <!-- Iconic Smiling Arc beneath the first 'o' -->
    <path
      d="M 76 81 C 76 88 94 88 94 81"
      stroke="#6B46C1"
      stroke-width="4.5"
      stroke-linecap="round"
      fill="none"
    />

    <!-- Stylized Dot Accent above first 'o' -->
    <circle cx="85" cy="27" r="4.5" fill="#9F7AEA" />
  </g>
</svg>
