<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <!-- Nagad Official Swirl Emblem with Red Runner Silhouette -->
  <g transform="translate(0, 0)">
    
    <!-- 1. Outer Red Crescent Swirl Arc (Bottom-Left to Bottom-Right) -->
    <path d="M 125 105
             C 95 135, 75 180, 75 230
             C 75 315, 145 385, 230 385
             C 275 385, 315 365, 345 330
             C 325 352, 280 370, 235 370
             C 160 370, 95 308, 95 230
             C 95 185, 112 142, 140 115
             Z"
          fill="#ED1C24" />

    <!-- 2. Inner Orange Swirling Body -->
    <path d="M 125 210
             C 120 170, 145 110, 185 75
             C 170 115, 145 165, 150 215
             C 155 265, 195 305, 245 305
             C 285 305, 320 280, 335 240
             C 345 275, 320 325, 275 348
             C 235 368, 175 355, 138 315
             C 112 285, 105 245, 125 210
             Z"
          fill="#F7941D" />

    <!-- 3. Top Three Fanned Dynamic Petals (Separated by clean white margins) -->
    <!-- Petal 1 (Leftmost - Orange) -->
    <path d="M 175 80
             C 195 105, 205 135, 200 165
             C 185 155, 165 150, 150 155
             C 138 185, 138 215, 142 240
             C 130 205, 135 150, 155 115
             Z"
          fill="#F7941D" />
    <path d="M 180 75
             C 155 100, 130 155, 130 210
             C 122 210, 115 190, 125 155
             C 135 120, 155 92, 180 75
             Z"
          fill="#F7941D" />

    <!-- Actual accurate petals modeled after Nagad Brand Identity -->
    <!-- Petal 1: Left Orange Petal -->
    <path d="M 178 76
             L 204 116
             C 185 135, 168 165, 160 200
             C 142 190, 132 165, 132 140
             C 132 110, 152 88, 178 76
             Z"
          fill="#F7941D" />

    <!-- Petal 2: Middle Red Petal -->
    <path d="M 198 84
             L 265 80
             L 266 133
             C 240 133, 215 145, 195 163
             L 182 135
             C 188 116, 192 100, 198 84
             Z"
          fill="#ED1C24" />

    <!-- Petal 3: Right Orange Petal -->
    <path d="M 271 115
             L 328 135
             L 300 188
             C 275 165, 245 155, 215 155
             L 225 140
             C 242 140, 258 132, 271 115
             Z"
          fill="#F7941D" />

    <!-- Lower Orange Swirl Arch encompassing the center bottom-right -->
    <path d="M 215 155
             C 260 155, 298 185, 304 230
             C 308 260, 295 290, 272 310
             C 240 338, 190 338, 155 310
             C 135 294, 122 268, 122 242
             C 122 275, 140 305, 168 322
             C 208 348, 262 342, 295 308
             C 328 275, 332 225, 305 186
             L 300 188
             Z"
          fill="#F7941D" />

    <!-- Inner Circle Background (Pure White) -->
    <circle cx="210" cy="235" r="66" fill="#FFFFFF" />

    <!-- 4. The Iconic Red Runner Silhouette (Post Runner) -->
    <g fill="#ED1C24">
      <!-- Runner Head & Turban -->
      <circle cx="203" cy="197" r="9.5" />
      <path d="M 194 196 C 194 190, 201 185, 209 187 C 215 189, 215 194, 214 198 C 208 196, 200 197, 194 196 Z" fill="#ED1C24" />

      <!-- Mail Bag on back -->
      <path d="M 207 201
               C 217 200, 228 206, 229 217
               C 229 224, 225 230, 217 231
               C 213 226, 211 216, 207 201
               Z" />

      <!-- Torso & Loincloth -->
      <path d="M 200 206
               L 211 208
               L 208 226
               L 197 225
               Z" />
      <!-- Dhoti / skirt flap in stride -->
      <path d="M 195 224
               L 212 225
               L 225 240
               L 204 246
               L 193 234
               Z" />

      <!-- Horizontal Mail Staff / Spear -->
      <path d="M 140 234 L 250 234 L 250 238 L 140 238 Z" />
      <!-- Spear Tip / Blade (Left end) -->
      <path d="M 142 236 L 158 230 L 155 236 L 158 242 Z" />
      <!-- Spear tassel tie -->
      <path d="M 160 238 L 157 248 L 160 248 L 162 238 Z" />

      <!-- Lantern hanging below spear -->
      <path d="M 168 238 L 168 244 L 180 244 L 180 238 Z" />
      <path d="M 166 244 L 182 244 L 180 268 L 168 268 Z" />
      <!-- Lantern inner cross / frame -->
      <path d="M 170 248 L 178 264 M 178 248 L 170 264" stroke="#FFFFFF" stroke-width="1.5" />
      <rect x="165" y="268" width="18" height="4" rx="1.5" />

      <!-- Front Leg (Stepping forward, bent at knee) -->
      <path d="M 200 242
               L 193 258
               L 195 284
               L 185 284
               L 187 256
               L 195 240
               Z" />

      <!-- Back Leg (Trailing in run, bent backward) -->
      <path d="M 209 238
               L 222 254
               L 250 256
               L 250 266
               L 216 264
               L 204 244
               Z" />

      <!-- Running Arms -->
      <!-- Left arm holding spear forward -->
      <path d="M 200 210
               L 188 222
               L 198 235
               L 194 237
               L 183 222
               L 196 208
               Z" />
      <!-- Right arm clutching spear handle -->
      <path d="M 207 210
               L 218 224
               L 214 236
               L 210 235
               L 213 225
               L 204 212
               Z" />
    </g>

  </g>
</svg>
