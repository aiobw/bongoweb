        </text>
      </g>

      <!-- Item 2 -->
      <g transform="translate(250, 0)">
        <circle cx="10" cy="10" r="8" fill="#10B981" />
        <path d="M7 10 L9 12 L13 8" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
        <text x="26" y="15" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="16" fill="#F1F5F9">
          100% Refund Guarantee
        </text>
      </g>

      <!-- Item 3 -->
      <g transform="translate(0, 42)">
        <circle cx="10" cy="10" r="8" fill="#7C3AED" />
        <path d="M7 10 L9 12 L13 8" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
        <text x="26" y="15" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="16" fill="#F1F5F9">
          Automated bKash &amp; Nagad
        </text>
      </g>

      <!-- Item 4 -->
      <g transform="translate(250, 42)">
        <circle cx="10" cy="10" r="8" fill="#F59E0B" />
        <path d="M7 10 L9 12 L13 8" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
        <text x="26" y="15" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="16" fill="#F1F5F9">
          Full Live Demo Testing
        </text>
      </g>
    </g>
  </g>

  <!-- Bottom Bar: Trust Indicators -->
  <g transform="translate(80, 520)">
    <text x="0" y="20" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="16" fill="#64748B">
      E-COMMERCE · RESTAURANT · BLOG &amp; MEDIA · GROCERY
    </text>
    <text x="1040" y="20" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="16" fill="#2B47EE" text-anchor="end">
      https://bongoweb.xyz
    </text>
  </g>
</svg>
